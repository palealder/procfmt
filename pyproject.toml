[project]
name = "procfmt"
version = "0.1.0"
description = "Normalize messy process-listing text into a canonical, streamable form"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "palealder"}]

[project.scripts]
procfmt = "procfmt.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
